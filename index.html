<!DOCTYPE html>
<html lang="en">
<head>
    <title>TB-6-Pro Advanced Drum Settings</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eef2f3; color: #333; }
        .box { background: white; padding: 25px; border-radius: 12px; max-width: 340px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        input[type="number"] { width: 60px; padding: 5px; border-radius: 4px; border: 1px solid #ccc; text-align: center; }
        input[type="range"] { width: 150px; }
        button { width: 100%; padding: 12px; background: #007AFF; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background: #0056b3; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
        h3 { margin-top: 0; text-align: center; color: #111; }
        label { font-weight: 500; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>TB-6-Pro Drum Config</h3>
        <button onclick="connect()">1. ACTIVATE WEBBLÉ MIDI</button>
        <hr>
        <div class="row">
            <label>Sensitivity Offset (0-20):</label>
            <input type="range" min="0" max="20" value="0" onchange="sendCC(100, this.value)">
        </div>
        <hr>
        <div class="row"><label>Pad 1 MIDI Note:</label><input type="number" value="36" onchange="sendCC(101, this.value)"></div>
        <div class="row"><label>Pad 2 MIDI Note:</label><input type="number" value="38" onchange="sendCC(102, this.value)"></div>
        <div class="row"><label>Pad 3 MIDI Note:</label><input type="number" value="40" onchange="sendCC(103, this.value)"></div>
        <div class="row"><label>Pad 4 MIDI Note:</label><input type="number" value="41" onchange="sendCC(104, this.value)"></div>
        <div class="row"><label>Pad 5 MIDI Note:</label><input type="number" value="43" onchange="sendCC(105, this.value)"></div>
        <div class="row"><label>Pad 6 MIDI Note:</label><input type="number" value="45" onchange="sendCC(106, this.value)"></div>
    </div>

    <script>
        let midiOut = null;

        async function connect() {
            if (navigator.requestMIDIAccess) {
                try {
                    const midi = await navigator.requestMIDIAccess({ sysex: false });
                    const outputs = Array.from(midi.outputs.values());
                    
                    // WebBLE creates a universal port wrapper or auto-targets active Bluetooth lines
                    midiOut = outputs.find(o => o.name.includes("TB-6-Pro") || o.name.includes("XIAO")) || outputs[0];
                    
                    if (midiOut) {
                        alert("Connected to WebBLE Output: " + midiOut.name);
                    } else {
                        alert("MIDI framework ready, but no destination device found. Open WebBLE's Bluetooth menu.");
                    }
                } catch (e) {
                    alert("MIDI Access denied: " + e.message);
                }
            } else {
                alert("Web MIDI is completely missing in this browser environment.");
            }
        }

        function sendCC(cc, val) {
            if (midiOut) {
                midiOut.send([0xB0, cc, parseInt(val)]);
                console.log("Sent CC " + cc + " value: " + val);
            } else {
                alert("Please click '1. ACTIVATE WEBBLÉ MIDI' first!");
            }
        }
    </script>
</body>
</html>
